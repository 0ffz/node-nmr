name: Gradle CI

on:
#  push:
#    branches:
#      - master
#    paths-ignore:
#      - '**.md'
#      - docs
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build
